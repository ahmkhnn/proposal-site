<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inshaal ❤️ Ahmie</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background">
    <div class="stars"></div>
    <div class="moon"></div>
  </div>

  <div id="particles"></div>

  <main class="scene" id="scene">

    <div class="progress">
      <span id="step">01</span>
      <div class="line">
        <div id="progressBar"></div>
      </div>
      <span>05</span>
    </div>

    <div class="card">

      <div class="heart-container">
        <div class="heart">❤</div>
        <div class="heart-ring"></div>
      </div>

      <p class="small">FOR INSH AAL ✨</p>

      <h1 id="question">Inshaal...</h1>

      <p id="subtext">
        I have a few questions for you.
      </p>

      <div class="answers">
        <button id="yesBtn">Of course ❤️</button>
        <button id="noBtn">No 😭</button>
      </div>

      <div id="reaction"></div>

    </div>

  </main>

  <div id="celebration">
    <div class="big-heart">❤</div>
    <h1>Inshaal ❤️</h1>
    <h2>Ahmie chose you...</h2>
    <p>And somehow, you chose him too. 🥹</p>
    <div class="final-text">Forever starts here ✨</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
